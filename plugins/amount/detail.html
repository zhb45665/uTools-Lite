<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>金额大写</title>
  <style>
    /* Theme follows the OS (Electron themeSource=system). */
    :root {
      --bg: #f1f4f8; --panel:#fff; --text:#182333; --dim:#69778a;
      --faint:#8b97a7; --divider:#dce3ec; --input-text:#182333;
      --btn-soft:#f4f7fb; --accent:#2864c7;
      --danger-text: #c03c32;
      --row-hover: rgba(0, 0, 0, 0.045);
      --ok: #1a7f37; --accent-soft:#edf3ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1e;
        --text: #e8e8ea;
        --dim: rgba(255, 255, 255, 0.4);
        --faint: rgba(255, 255, 255, 0.3);
        --divider: rgba(255, 255, 255, 0.08);
        --input-text: #f2f2f4;
        --btn-soft: rgba(255, 255, 255, 0.1);
        --accent: #6d93e8;
        --danger-text: #e2726a;
        --row-hover: rgba(255, 255, 255, 0.06);
        --ok: #6cc187; --accent-soft:rgba(109,147,232,.13);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% -20%, var(--accent-soft), transparent 48%), var(--bg);
      color: var(--text);
      font: 14px "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height:60px; padding:9px 7px 9px 18px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
      -webkit-app-region: drag; /* 无边框窗口拖拽区域 */
      background:var(--panel); user-select:none;
    }
    .tool-brand { display:flex; align-items:center; gap:10px; }.brand-mark { width:38px; height:38px; display:grid; place-items:center; border-radius:11px; background:var(--accent); color:#fff; font-size:18px; box-shadow:0 7px 18px #2864c733; }.brand-copy { display:flex; flex-direction:column; }.brand-copy strong { font-size:16px; }.brand-copy small { color:var(--dim); font-size:11px; }
    .bar .status { flex: 1; font-size: 11px; color: var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    button {
      background: var(--btn-soft);
      border: none;
      color: var(--text);
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      -webkit-app-region: no-drag; /* 按钮不触发拖拽 */
    }
    button:hover { filter: brightness(0.96); }

    .inputrow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin:14px 14px 8px; padding:15px 18px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
      background:var(--panel); border:1px solid var(--divider); border-radius:14px;
      box-shadow:0 8px 24px #20324a09; transition:border-color .18s ease, box-shadow .18s ease;
    }
    .inputrow:focus-within { border-color:color-mix(in srgb, var(--accent) 48%, var(--divider)); box-shadow:0 10px 28px #2864c715; }
    .inputrow .cur {
      font: 24px/1 Consolas, "Courier New", monospace;
      color: var(--dim);
    }
    .amount {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--input-text);
      font: 26px/1.3 Consolas, "Courier New", monospace;
      letter-spacing: 0.5px;
      padding: 0;
    }
    .amount::placeholder { color: var(--faint); font-size: 18px; letter-spacing: 0; }

    .results { flex:1; overflow-y:auto; margin:0 14px 14px; padding:10px; background:var(--panel); border:1px solid var(--divider); border-radius:14px; box-shadow:0 12px 34px #20324a0d; }
    .row {
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .row:hover { background: var(--row-hover); }
    .row .label {
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 3px;
    }
    .row .value {
      font: 19px/1.5 Consolas, "Courier New", monospace;
      word-break: break-all;
    }
    .row.primary .value {
      font-size: 25px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 1px;
    }
    .row.copied .value { color: var(--ok); }
    .empty {
      height:100%; min-height:180px; padding:26px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
      text-align: center;
      color: var(--faint);
      font-size: 13px;
    }
    .empty::before { content:"¥"; width:44px; height:44px; display:grid; place-items:center; border-radius:14px; background:var(--accent-soft); color:var(--accent); font:600 22px/1 Consolas,monospace; }
    .empty small { font-size:11px; color:var(--faint); }
    .foot {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 6px 14px;
      font-size: 11px;
      color: var(--faint);
      border-top: 1px solid var(--divider);
      flex-shrink: 0;
    }
    .foot .sp { flex: 1; }
    .window-controls { align-self:stretch; display:flex; align-items:center; margin-left:4px; padding-left:6px; border-left:1px solid var(--divider); -webkit-app-region:no-drag; }.window-controls .window-btn { width:38px; height:32px; padding:0; border:0; border-radius:7px; background:transparent; color:var(--dim); display:grid; place-items:center; font-size:13px; }.window-controls .window-btn:hover { background:var(--btn-soft); color:var(--text); }.window-controls .window-close:hover { background:#c7434d; color:#fff; }
    @media(prefers-color-scheme:dark) { :root { --panel:#202834; }.brand-mark { color:#182333; box-shadow:none; } }
    @media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>
<body>
  <div class="bar">
    <div class="tool-brand"><span class="brand-mark">¥</span><div class="brand-copy"><strong>金额大写</strong><small>人民币票据格式转换</small></div></div>
    <span class="status" id="status">加载中…</span>
    <button id="paste">📋 读剪贴板</button>
    <button id="clear">清空</button>
    <div class="window-controls" aria-label="窗口控制"><button class="window-btn" id="window-min" title="最小化">─</button><button class="window-btn" id="window-max" title="最大化">□</button><button class="window-btn window-close" id="window-close" title="关闭">✕</button></div>
  </div>
  <div class="inputrow">
    <span class="cur">¥</span>
    <input id="amount" class="amount" type="text" spellcheck="false" autocomplete="off"
           placeholder="粘贴或输入金额，例如 1234.56" />
  </div>
  <div class="results" id="results"></div>
  <div class="foot">
    <span>双击任意结果即可复制 · 支持千分位 / 全角 / 负数 / ¥ 符号</span>
    <span class="sp"></span>
    <span>Esc 关闭</span>
  </div>

  <!-- 与插件沙箱 main.js 共用同一份转换实现 -->
  <script src="convert.js"></script>
  <script>
    const amountEl = document.getElementById("amount");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const windowMin = document.getElementById("window-min"), windowMax = document.getElementById("window-max"), windowClose = document.getElementById("window-close");
    windowMin.onclick = () => void uTools.noteWindowMinimize();
    windowMax.onclick = () => void uTools.noteWindowToggleMaximize();
    windowClose.onclick = () => void uTools.closeDetail();
    uTools.onNoteWindowState((maximized) => { windowMax.textContent = maximized ? "❐" : "□"; windowMax.title = maximized ? "还原" : "最大化"; });

    const setStatus = (s) => { statusEl.textContent = s; };
    const ready = () => typeof AmountConvert === "object";

    const ROWS = [
      {
        key: "capital",
        label: "人民币大写",
        primary: true,
        get: (raw) => AmountConvert.toCapitalAmount(raw),
      },
      {
        key: "prefixed",
        label: "带人民币前缀（票据写法）",
        get: (raw) => {
          const c = AmountConvert.toCapitalAmount(raw);
          return c ? "人民币" + c : null;
        },
      },
      {
        key: "plain",
        label: "规范数字",
        get: (raw) => AmountConvert.formatCurrency(raw),
      },
    ];

    function render(raw) {
      resultsEl.replaceChildren();
      const typed = String(amountEl.value || "").trim();
      const rows = [];
      for (const r of ROWS) {
        const v = r.get(raw);
        if (v) rows.push({ row: r, value: v });
      }
      if (rows.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        const message = document.createElement("span");
        message.textContent = typed ? "不是有效金额，请检查输入" : "输入金额，即时生成票据大写";
        const tip = document.createElement("small");
        tip.textContent = typed ? "支持数字、千分位、全角字符和负数" : "例如 1234.56";
        empty.append(message, tip);
        resultsEl.appendChild(empty);
        return;
      }
      for (const { row: r, value } of rows) {
        const el = document.createElement("div");
        el.className = "row" + (r.primary ? " primary" : "");
        el.dataset.copy = value;
        el.title = "双击复制";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = r.label;
        const val = document.createElement("div");
        val.className = "value";
        val.textContent = value;
        el.append(label, val);
        resultsEl.appendChild(el);
      }
    }

    const convert = () => render(amountEl.value);

    amountEl.addEventListener("input", convert);

    resultsEl.addEventListener("dblclick", (e) => {
      const row = e.target && e.target.closest ? e.target.closest(".row") : null;
      if (row) void copyValue(row);
    });

    async function copyValue(row) {
      const text = row.dataset.copy || "";
      if (!text) return;
      try {
        await uTools.copyText(text);
        flash(row, text);
      } catch (err) {
        setStatus("复制失败: " + (err && err.message ? err.message : err));
      }
    }

    function flash(row, text) {
      if (row._flash) window.clearTimeout(row._flash);
      const val = row.querySelector(".value");
      row.classList.add("copied");
      val.textContent = text + "   ✓ 已复制";
      row._flash = window.setTimeout(() => {
        row.classList.remove("copied");
        val.textContent = text;
      }, 900);
    }

    document.getElementById("clear").onclick = () => {
      amountEl.value = "";
      convert();
      amountEl.focus();
      setStatus("已清空");
    };

    document.getElementById("paste").onclick = async () => {
      try {
        const text = await uTools.getClipboardText();
        if (!ready() || AmountConvert.toCapitalAmount(text) === null) {
          setStatus("剪贴板里没有可用金额");
          return;
        }
        amountEl.value = String(text).trim();
        convert();
        amountEl.focus();
        setStatus("已从剪贴板读取");
      } catch (err) {
        setStatus("读剪贴板失败: " + (err && err.message ? err.message : err));
      }
    };

    window.addEventListener("DOMContentLoaded", async () => {
      if (!ready()) {
        setStatus("转换模块加载失败");
        return;
      }
      let ctx = null;
      try { ctx = await uTools.getDetailContext(); } catch (_) { /* ignore */ }
      const item = ctx && ctx.item ? ctx.item : null;
      const fromSearch = item && item.data ? String(item.data.value || "") : "";
      if (fromSearch && AmountConvert.toCapitalAmount(fromSearch) !== null) {
        amountEl.value = fromSearch;
        convert();
        amountEl.focus();
        setStatus("来自搜索的金额");
        return;
      }
      // 打开即自动读剪贴板：复制了金额 -> 打开面板 -> 已经转好了
      try {
        const clip = await uTools.getClipboardText();
        const text = String(clip == null ? "" : clip).trim();
        if (text && text.length <= 32 && AmountConvert.toCapitalAmount(text) !== null) {
          amountEl.value = text;
          convert();
          amountEl.focus();
          setStatus("已自动读取剪贴板");
          return;
        }
      } catch (_) { /* clipboard unavailable -> manual input */ }
      convert();
      amountEl.focus();
      setStatus("就绪");
    });
  </script>
</body>
</html>
