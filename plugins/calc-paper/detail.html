<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>计算稿纸</title>
  <style>
    /* Theme follows the OS (Electron themeSource=system). */
    :root {
      --bg: #f7f7f9;
      --text: #1c1c1e;
      --dim: rgba(0, 0, 0, 0.4);
      --faint: rgba(0, 0, 0, 0.3);
      --divider: rgba(0, 0, 0, 0.08);
      --input-text: #111113;
      --btn-soft: rgba(0, 0, 0, 0.06);
      --accent: #2f5fd0;
      --danger-soft: rgba(200, 60, 50, 0.12);
      --danger-text: #c03c32;
      --line-active: rgba(47, 95, 208, 0.07);
      --ok: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1e;
        --text: #e8e8ea;
        --dim: rgba(255, 255, 255, 0.4);
        --faint: rgba(255, 255, 255, 0.3);
        --divider: rgba(255, 255, 255, 0.08);
        --input-text: #f2f2f4;
        --btn-soft: rgba(255, 255, 255, 0.1);
        --accent: #6d93e8;
        --danger-soft: rgba(230, 90, 80, 0.18);
        --danger-text: #e2726a;
        --line-active: rgba(109, 147, 232, 0.1);
        --ok: #6cc187;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px "Segoe UI", system-ui, sans-serif;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }
    .bar .title { font-weight: 600; }
    .bar .status { flex: 1; font-size: 12px; color: var(--dim); }
    button {
      background: var(--btn-soft);
      border: none;
      color: var(--text);
      border-radius: 7px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button.danger { background: var(--danger-soft); color: var(--danger-text); }

    /* ---- the paper itself: no boxes, no equals button ---- */
    #paper {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px 40px;
      cursor: text;
    }
    .line {
      position: relative;
      padding: 2px 8px 4px 16px;
      border-radius: 6px;
    }
    .line.active { background: var(--line-active); }
    .line.active::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 7px;
      bottom: 8px;
      width: 2px;
      border-radius: 1px;
      background: var(--accent);
    }
    .expr {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--input-text);
      font: 20px/1.5 Consolas, "Courier New", monospace;
      letter-spacing: 0.2px;
      padding: 0;
    }
    .expr::placeholder { color: var(--faint); font-size: 17px; }
    .res {
      font: 16px/1.45 Consolas, "Courier New", monospace;
      color: var(--accent);
      padding: 2px 0 0 30px;
      cursor: pointer;
      user-select: none;
    }
    .res.bad {
      color: var(--danger-text);
      opacity: 0.65;
      font-size: 14px;
      cursor: default;
    }
    .res.copied { color: var(--ok); }
    .res:empty { display: none; }

    .foot {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 6px 14px;
      font-size: 11px;
      color: var(--faint);
      border-top: 1px solid var(--divider);
      flex-shrink: 0;
    }
    .foot .sum { color: var(--dim); }
    .foot .sp { flex: 1; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="title">🧾 计算稿纸</span>
    <span class="status" id="status">加载中…</span>
    <button class="danger" id="clear">🧹 一键清空</button>
  </div>
  <div id="paper"></div>
  <div class="foot">
    <span id="count">0 行</span>
    <span class="sum" id="sum"></span>
    <span class="sp"></span>
    <span>逐行输入，结果自动出现在该行下方 · 双击结果可复制 · Esc 关闭</span>
  </div>
  <script>
    const PAPER_FILE = "paper.txt";
    const paperEl = document.getElementById("paper");
    const statusEl = document.getElementById("status");
    const countEl = document.getElementById("count");
    const sumEl = document.getElementById("sum");

    let lines = [""];
    let saveTimer = null;

    const setStatus = (s) => { statusEl.textContent = s; };
    const round10 = (v) => Math.round(v * 1e10) / 1e10;

    /**
     * Arithmetic evaluator — same hand-written recursive descent parser the
     * plugin's main.js uses (digits, + - * / %, parens, unary minus).
     * No dynamic code execution. Returns a finite number or null.
     */
    function evalExpr(raw) {
      const expr = String(raw == null ? "" : raw).trim().replace(/^[=]\s*/, "");
      if (expr.length === 0) return null;
      if (!/\d/.test(expr)) return null;
      if (!/[+\-*/%]/.test(expr)) return null;
      if (!/^[\s\d+\-*/().%]+$/.test(expr)) return null;
      let pos = 0;
      const skipWs = () => { while (pos < expr.length && expr[pos] === " ") pos++; };
      function parseFactor() {
        skipWs();
        if (expr[pos] === "-") { pos++; return -parseFactor(); }
        if (expr[pos] === "(") {
          pos++;
          const v = parseExpression();
          skipWs();
          if (expr[pos] !== ")") throw new Error("unbalanced parens");
          pos++;
          return v;
        }
        const m = /^[0-9]+(\.[0-9]+)?/.exec(expr.slice(pos));
        if (!m) throw new Error("bad number");
        pos += m[0].length;
        return parseFloat(m[0]);
      }
      function parseTerm() {
        let v = parseFactor();
        for (;;) {
          skipWs();
          const c = expr[pos];
          if (c === "*" || c === "/" || c === "%") {
            pos++;
            const r = parseFactor();
            v = c === "*" ? v * r : c === "/" ? v / r : v % r;
          } else return v;
        }
      }
      function parseExpression() {
        let v = parseTerm();
        for (;;) {
          skipWs();
          const c = expr[pos];
          if (c === "+" || c === "-") {
            pos++;
            const r = parseTerm();
            v = c === "+" ? v + r : v - r;
          } else return v;
        }
      }
      try {
        const v = parseExpression();
        skipWs();
        if (pos !== expr.length) return null;
        if (typeof v !== "number" || !Number.isFinite(v)) return null;
        return round10(v);
      } catch (_) {
        return null;
      }
    }

    // ---------------------------------------------------------------- rows
    function updateResult(row, i, forceSettled) {
      const res = row.querySelector(".res");
      const inp = row.querySelector(".expr");
      const raw = lines[i] || "";
      const v = evalExpr(raw);
      // While the user is still typing on this line we stay quiet (an
      // incomplete expression is not an error). `document.activeElement` is
      // unreliable inside blur handlers, hence the explicit settled flag.
      const focused = !forceSettled && document.activeElement === inp;
      if (v !== null) {
        res.className = "res";
        res.textContent = "= " + v;
      } else if (raw.trim() && !focused) {
        res.className = "res bad";
        res.textContent = "表达式无效";
      } else {
        res.className = "res";
        res.textContent = "";
      }
    }

    function updateFooter() {
      const used = lines.filter((l) => l.trim() !== "");
      const nums = used.map(evalExpr).filter((v) => v !== null);
      countEl.textContent = used.length + " 行";
      sumEl.textContent = nums.length
        ? "· 合计 " + round10(nums.reduce((a, b) => a + b, 0))
        : "";
    }

    function focusLine(i) {
      const inputs = paperEl.querySelectorAll(".expr");
      if (!inputs.length) return;
      const el = inputs[Math.min(Math.max(i, 0), inputs.length - 1)];
      el.focus();
      const n = el.value.length;
      try { el.setSelectionRange(n, n); } catch (_) { /* ignore */ }
      const row = el.closest(".line");
      if (row) row.scrollIntoView({ block: "nearest" });
    }

    function render(focusAt) {
      paperEl.replaceChildren();
      lines.forEach((text, i) => {
        const row = document.createElement("div");
        row.className = "line";
        const inp = document.createElement("input");
        inp.className = "expr";
        inp.type = "text";
        inp.value = text;
        inp.spellcheck = false;
        inp.autocomplete = "off";
        if (lines.length === 1 && text === "") inp.placeholder = "例如：2+2*3";
        inp.addEventListener("input", () => {
          lines[i] = inp.value;
          updateResult(row, i);
          updateFooter();
          scheduleSave();
        });
        inp.addEventListener("focus", () => {
          paperEl.querySelectorAll(".line.active").forEach((el) => el.classList.remove("active"));
          row.classList.add("active");
        });
        inp.addEventListener("blur", () => {
          row.classList.remove("active");
          updateResult(row, i, true);
        });
        inp.addEventListener("keydown", (e) => onKey(e, i, inp));
        const res = document.createElement("div");
        res.className = "res";
        res.title = "双击复制结果";
        row.dataset.i = String(i);
        row.append(inp, res);
        paperEl.appendChild(row);
        updateResult(row, i);
      });
      updateFooter();
      if (focusAt !== undefined) focusLine(focusAt);
    }

    function onKey(e, i, inp) {
      if (e.key === "Enter") {
        if (e.isComposing) return; // let the IME commit first
        e.preventDefault();
        if (i + 1 < lines.length && lines[i + 1].trim() === "") {
          focusLine(i + 1);
          return;
        }
        if (lines[i].trim() === "" && i === lines.length - 1) return;
        lines.splice(i + 1, 0, "");
        render(i + 1);
        scheduleSave();
      } else if (e.key === "Backspace" && inp.value === "" && lines.length > 1) {
        e.preventDefault();
        lines.splice(i, 1);
        render(Math.max(0, i - 1));
        scheduleSave();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        focusLine(i - 1);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        focusLine(i + 1);
      }
    }

    // clicking empty paper space puts the caret back on the last line
    paperEl.addEventListener("mousedown", (e) => {
      if (e.target === paperEl) {
        e.preventDefault();
        focusLine(lines.length - 1);
      }
    });

    // double-click a result line to copy just the number
    paperEl.addEventListener("dblclick", (e) => {
      const res = e.target && e.target.closest ? e.target.closest(".res") : null;
      if (!res || res.classList.contains("bad")) return;
      const row = res.closest(".line");
      const i = row ? Number(row.dataset.i) : -1;
      if (i < 0) return;
      void copyResult(res, i);
    });

    async function copyResult(res, i) {
      const v = evalExpr(lines[i] || "");
      if (v === null) return;
      const text = String(v);
      try {
        await uTools.copyText(text);
        flashCopied(res, i, text);
      } catch (e) {
        setStatus("复制失败: " + (e && e.message ? e.message : e));
      }
    }

    function flashCopied(res, i, text) {
      if (res._flash) window.clearTimeout(res._flash);
      res.classList.add("copied");
      res.textContent = "= " + text + "   ✓ 已复制";
      res._flash = window.setTimeout(() => {
        res.classList.remove("copied");
        updateResult(res.closest(".line"), i, true);
      }, 900);
    }

    // ---------------------------------------------------------- persistence
    function scheduleSave() {
      if (saveTimer) window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => { void save(); }, 400);
    }

    async function save() {
      try {
        await uTools.writeFile(PAPER_FILE, lines.join("\n"));
        setStatus("已暂存 " + new Date().toLocaleTimeString());
      } catch (e) {
        setStatus("暂存失败: " + (e && e.message ? e.message : e));
      }
    }

    document.getElementById("clear").onclick = () => {
      lines = [""];
      render(0);
      void save();
      uTools.toast("计算稿纸已清空 🧹");
    };

    // --------------------------------------------------------------- load
    window.addEventListener("DOMContentLoaded", async () => {
      let ctx = null;
      try { ctx = await uTools.getDetailContext(); } catch (_) { /* ignore */ }
      const item = ctx && ctx.item ? ctx.item : null;

      let migrated = false;
      try {
        const txt = await uTools.readFile(PAPER_FILE);
        lines = String(txt).split("\n");
      } catch (_) {
        // one-time migration from the older records.json format
        try {
          const raw = await uTools.readFile("records.json");
          const parsed = JSON.parse(raw);
          lines = Array.isArray(parsed)
            ? parsed.map((r) => String((r && r.expr) || "")).filter(Boolean)
            : [];
          migrated = lines.length > 0;
        } catch (_) {
          lines = [];
        }
      }
      if (lines.length === 0) lines = [""];

      // The expression that opened this view (inline calc / auto-open). All
      // trailing blank lines are dropped first so an empty paper never ends
      // up with a stray blank row above the incoming expression.
      const incoming =
        item && item.data && item.data.action === "calc"
          ? String(item.data.expr || "").trim()
          : "";
      let needsSave = migrated;
      while (lines.length && lines[lines.length - 1].trim() === "") lines.pop();
      if (incoming && String(lines[lines.length - 1] || "") !== incoming) {
        lines.push(incoming);
        needsSave = true;
      }
      while (lines.length && lines[lines.length - 1].trim() === "") lines.pop();
      lines.push(""); // the paper always keeps one blank line to type on

      render();
      focusLine(lines.length - 1);
      updateFooter();
      setStatus("已就绪");
      if (needsSave) void save(); // materialise paper.txt
    });
  </script>
</body>
</html>
