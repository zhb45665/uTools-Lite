<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>计算稿纸</title>
  <style>
    /* Theme follows the OS (Electron themeSource=system). */
    :root {
      --bg: #f1f4f8;
      --panel: #ffffff;
      --text: #182333;
      --dim: #69778a;
      --faint: #8b97a7;
      --divider: #dce3ec;
      --input-text: #182333;
      --btn-soft: #f4f7fb;
      --accent: #2864c7;
      --danger-soft: rgba(200, 60, 50, 0.12);
      --danger-text: #c03c32;
      --line-active: rgba(47, 95, 208, 0.07);
      --ok: #1a7f37;
      --accent-soft: #edf3ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1e;
        --text: #e8e8ea;
        --dim: rgba(255, 255, 255, 0.4);
        --faint: rgba(255, 255, 255, 0.3);
        --divider: rgba(255, 255, 255, 0.08);
        --input-text: #f2f2f4;
        --btn-soft: rgba(255, 255, 255, 0.1);
        --accent: #6d93e8;
        --danger-soft: rgba(230, 90, 80, 0.18);
        --danger-text: #e2726a;
        --line-active: rgba(109, 147, 232, 0.1);
        --ok: #6cc187;
        --accent-soft: rgba(109, 147, 232, 0.13);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% -20%, var(--accent-soft), transparent 48%), var(--bg);
      color: var(--text);
      font: 14px "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 60px;
      padding: 9px 7px 9px 18px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
      background: var(--panel);
      -webkit-app-region: drag;
      user-select: none;
    }
    .tool-brand { display:flex; align-items:center; gap:10px; }
    .brand-mark { width:38px; height:38px; display:grid; place-items:center; border-radius:11px; background:var(--accent); color:#fff; font-size:18px; box-shadow:0 7px 18px #2864c733; }
    .brand-copy { display:flex; flex-direction:column; }.brand-copy strong { font-size:16px; }.brand-copy small { font-size:11px; color:var(--dim); }
    .bar .status { flex: 1; font-size: 11px; color: var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    button {
      background: var(--btn-soft);
      border: none;
      color: var(--text);
      border-radius: 7px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    button.danger { background: var(--danger-soft); color: var(--danger-text); }

    /* ---- the paper itself: no boxes, no equals button ---- */
    #paper {
      flex: 1;
      overflow-y: auto;
      margin: 14px;
      padding: 18px 20px 40px;
      cursor: text;
      background: var(--panel);
      border: 1px solid var(--divider);
      border-radius: 14px;
      box-shadow: 0 12px 34px #20324a0d;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    #paper:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--divider)); box-shadow:0 14px 38px #2864c716; }
    .line {
      position: relative;
      padding: 2px 8px 4px 16px;
      border-radius: 6px;
    }
    .line.active { background: var(--line-active); }
    .line.active::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 7px;
      bottom: 8px;
      width: 2px;
      border-radius: 1px;
      background: var(--accent);
    }
    .expr {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--input-text);
      font: 20px/1.5 Consolas, "Courier New", monospace;
      letter-spacing: 0.2px;
      padding: 0;
    }
    .expr::placeholder { color: var(--faint); font-size: 17px; }
    .res {
      font: 16px/1.45 Consolas, "Courier New", monospace;
      color: var(--accent);
      padding: 2px 0 0 30px;
      cursor: pointer;
      user-select: none;
    }
    .res.bad {
      color: var(--danger-text);
      opacity: 0.65;
      font-size: 14px;
      cursor: default;
    }
    .res.copied { color: var(--ok); }
    .res:empty { display: none; }

    .foot {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 6px 14px;
      font-size: 11px;
      color: var(--faint);
      border-top: 1px solid var(--divider);
      flex-shrink: 0;
    }
    .foot .sum { color: var(--dim); }
    .foot .sp { flex: 1; }
    .window-controls { align-self:stretch; display:flex; align-items:center; margin-left:4px; padding-left:6px; border-left:1px solid var(--divider); -webkit-app-region:no-drag; }
    .window-controls .window-btn { width:38px; height:32px; padding:0; border:0; border-radius:7px; background:transparent; color:var(--dim); display:grid; place-items:center; font-size:13px; }
    .window-controls .window-btn:hover { background:var(--btn-soft); color:var(--text); }.window-controls .window-close:hover { background:#c7434d; color:#fff; }
    @media (prefers-color-scheme: dark) { :root { --panel:#202834; } .brand-mark { color:#182333; box-shadow:none; } }
    @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>
<body>
  <div class="bar">
    <div class="tool-brand"><span class="brand-mark">∑</span><div class="brand-copy"><strong>计算稿纸</strong><small>逐行计算与本地暂存</small></div></div>
    <span class="status" id="status">加载中…</span>
    <button class="danger" id="clear">🧹 一键清空</button>
    <div class="window-controls" aria-label="窗口控制"><button class="window-btn" id="window-min" title="最小化">─</button><button class="window-btn" id="window-max" title="最大化">□</button><button class="window-btn window-close" id="window-close" title="关闭">✕</button></div>
  </div>
  <div id="paper"></div>
  <div class="foot">
    <span id="count">0 行</span>
    <span class="sum" id="sum"></span>
    <span class="sp"></span>
    <span>回车提交并带入结果继续计算 · 直接输入数字开始新算式 · 双击结果可复制</span>
  </div>
  <script>
    const PAPER_FILE = "paper.txt";
    const paperEl = document.getElementById("paper");
    const statusEl = document.getElementById("status");
    const countEl = document.getElementById("count");
    const sumEl = document.getElementById("sum");

    const windowMin = document.getElementById("window-min");
    const windowMax = document.getElementById("window-max");
    const windowClose = document.getElementById("window-close");
    windowMin.onclick = () => void uTools.noteWindowMinimize();
    windowMax.onclick = () => void uTools.noteWindowToggleMaximize();
    windowClose.onclick = () => void uTools.closeDetail();
    uTools.onNoteWindowState((maximized) => {
      windowMax.textContent = maximized ? "❐" : "□";
      windowMax.title = maximized ? "还原" : "最大化";
    });

    let lines = [""];
    // Rows seeded from the preceding result. Typing an operator continues
    // from that result; typing a number starts a fresh calculation.
    const continuationRows = new Set();
    let saveTimer = null;

    const setStatus = (s) => { statusEl.textContent = s; };
    const round10 = (v) => Math.round(v * 1e10) / 1e10;

    /**
     * Arithmetic evaluator — same hand-written recursive descent parser the
     * plugin's main.js uses (digits, + - * / %, parens, unary minus).
     * No dynamic code execution. Returns a finite number or null.
     */
    function evalExpr(raw) {
      const expr = String(raw == null ? "" : raw).trim().replace(/^[=]\s*/, "");
      if (expr.length === 0) return null;
      if (!/\d/.test(expr)) return null;
      if (!/[+\-*/%]/.test(expr)) return null;
      if (!/^[\s\d+\-*/().%]+$/.test(expr)) return null;
      let pos = 0;
      const skipWs = () => { while (pos < expr.length && expr[pos] === " ") pos++; };
      function parseFactor() {
        skipWs();
        if (expr[pos] === "-") { pos++; return -parseFactor(); }
        if (expr[pos] === "(") {
          pos++;
          const v = parseExpression();
          skipWs();
          if (expr[pos] !== ")") throw new Error("unbalanced parens");
          pos++;
          return v;
        }
        const m = /^[0-9]+(\.[0-9]+)?/.exec(expr.slice(pos));
        if (!m) throw new Error("bad number");
        pos += m[0].length;
        return parseFloat(m[0]);
      }
      function parseTerm() {
        let v = parseFactor();
        for (;;) {
          skipWs();
          const c = expr[pos];
          if (c === "*" || c === "/" || c === "%") {
            pos++;
            const r = parseFactor();
            v = c === "*" ? v * r : c === "/" ? v / r : v % r;
          } else return v;
        }
      }
      function parseExpression() {
        let v = parseTerm();
        for (;;) {
          skipWs();
          const c = expr[pos];
          if (c === "+" || c === "-") {
            pos++;
            const r = parseTerm();
            v = c === "+" ? v + r : v - r;
          } else return v;
        }
      }
      try {
        const v = parseExpression();
        skipWs();
        if (pos !== expr.length) return null;
        if (typeof v !== "number" || !Number.isFinite(v)) return null;
        return round10(v);
      } catch (_) {
        return null;
      }
    }

    /** Keep expressions calculator-like while the user types or pastes.
     * A second binary operator replaces the previous one (`5+*` -> `5*`). */
    function sanitizeExpression(raw) {
      const source = String(raw == null ? "" : raw)
        .replace(/[×xX]/g, "*")
        .replace(/÷/g, "/")
        .replace(/[，,]/g, ".")
        .replace(/[^\d+\-*/().%]/g, "");
      let out = "";
      const isOp = (c) => "+-*/%".includes(c || "");
      for (const ch of source) {
        const last = out[out.length - 1] || "";
        if (/\d/.test(ch)) {
          out += ch;
        } else if (ch === ".") {
          const segment = out.split(/[+\-*/%()]/).pop() || "";
          if (segment.includes(".")) continue;
          out += !out || isOp(last) || last === "(" ? "0." : ".";
        } else if (isOp(ch)) {
          if (!out) {
            if (ch === "-") out = "-";
          } else if (isOp(last)) {
            // The newest operator is the user's current intent.
            if (out.length === 1 && last === "-") continue;
            out = out.slice(0, -1) + ch;
          } else if (last === "(") {
            if (ch === "-") out += ch;
          } else {
            out += ch;
          }
        } else if (ch === "(") {
          if (!out || isOp(last) || last === "(") out += ch;
        } else if (ch === ")") {
          const opens = (out.match(/\(/g) || []).length;
          const closes = (out.match(/\)/g) || []).length;
          if (opens > closes && /[\d)]/.test(last)) out += ch;
        }
      }
      return out;
    }

    // ---------------------------------------------------------------- rows
    function updateResult(row, i, forceSettled) {
      const res = row.querySelector(".res");
      const inp = row.querySelector(".expr");
      const raw = lines[i] || "";
      const v = evalExpr(raw);
      const continuation = continuationRows.has(i);
      // While the user is still typing on this line we stay quiet (an
      // incomplete expression is not an error). `document.activeElement` is
      // unreliable inside blur handlers, hence the explicit settled flag.
      const focused = !forceSettled && document.activeElement === inp;
      if (v !== null) {
        res.className = "res";
        res.textContent = "= " + v;
      } else if (raw.trim() && !focused && !continuation) {
        res.className = "res bad";
        res.textContent = "表达式无效";
      } else {
        res.className = "res";
        res.textContent = "";
      }
    }

    function updateFooter() {
      const used = lines.filter((l) => l.trim() !== "");
      const nums = used.map(evalExpr).filter((v) => v !== null);
      countEl.textContent = used.length + " 行";
      sumEl.textContent = nums.length
        ? "· 合计 " + round10(nums.reduce((a, b) => a + b, 0))
        : "";
    }

    function focusLine(i) {
      const inputs = paperEl.querySelectorAll(".expr");
      if (!inputs.length) return;
      const el = inputs[Math.min(Math.max(i, 0), inputs.length - 1)];
      el.focus();
      const n = el.value.length;
      try { el.setSelectionRange(n, n); } catch (_) { /* ignore */ }
      const row = el.closest(".line");
      if (row) row.scrollIntoView({ block: "nearest" });
    }

    function render(focusAt) {
      paperEl.replaceChildren();
      lines.forEach((text, i) => {
        const row = document.createElement("div");
        row.className = "line";
        const inp = document.createElement("input");
        inp.className = "expr";
        inp.type = "text";
        inp.value = text;
        inp.spellcheck = false;
        inp.autocomplete = "off";
        if (lines.length === 1 && text === "") inp.placeholder = "例如：2+2*3";
        inp.addEventListener("input", () => {
          const caret = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
          const cleaned = sanitizeExpression(inp.value);
          if (cleaned !== inp.value) {
            const removed = inp.value.length - cleaned.length;
            inp.value = cleaned;
            const nextCaret = Math.max(0, caret - Math.max(0, removed));
            try { inp.setSelectionRange(nextCaret, nextCaret); } catch (_) { /* ignore */ }
          }
          lines[i] = cleaned;
          continuationRows.delete(i);
          updateResult(row, i);
          updateFooter();
          scheduleSave();
        });
        inp.addEventListener("focus", () => {
          paperEl.querySelectorAll(".line.active").forEach((el) => el.classList.remove("active"));
          row.classList.add("active");
        });
        inp.addEventListener("blur", () => {
          row.classList.remove("active");
          updateResult(row, i, true);
        });
        inp.addEventListener("keydown", (e) => onKey(e, i, inp));
        const res = document.createElement("div");
        res.className = "res";
        res.title = "双击复制结果";
        row.dataset.i = String(i);
        row.append(inp, res);
        paperEl.appendChild(row);
        updateResult(row, i);
      });
      updateFooter();
      if (focusAt !== undefined) focusLine(focusAt);
    }

    function onKey(e, i, inp) {
      if (continuationRows.has(i) && e.key === "Backspace") {
        e.preventDefault();
        lines[i] = "";
        continuationRows.delete(i);
        render(i);
        scheduleSave();
        return;
      }
      if (
        continuationRows.has(i) &&
        !e.ctrlKey && !e.metaKey && !e.altKey &&
        (/^[\d.(]$/.test(e.key))
      ) {
        // A number means "new calculation"; an operator below means
        // "continue from the previous result".
        inp.value = "";
        lines[i] = "";
        continuationRows.delete(i);
      }
      if (e.key === "Enter") {
        if (e.isComposing) return; // let the IME commit first
        e.preventDefault();
        const value = evalExpr(lines[i]);
        if (value === null) {
          if (lines[i].trim()) {
            updateResult(inp.closest(".line"), i, true);
            setStatus("请先完成有效的计算表达式");
          }
          return;
        }
        const seed = String(value);
        if (i + 1 < lines.length && lines[i + 1].trim() === "") {
          lines[i + 1] = seed;
        } else {
          lines.splice(i + 1, 0, seed);
        }
        continuationRows.clear();
        continuationRows.add(i + 1);
        render(i + 1);
        scheduleSave();
      } else if (e.key === "Backspace" && inp.value === "" && lines.length > 1) {
        e.preventDefault();
        lines.splice(i, 1);
        render(Math.max(0, i - 1));
        scheduleSave();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        focusLine(i - 1);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        focusLine(i + 1);
      }
    }

    // clicking empty paper space puts the caret back on the last line
    paperEl.addEventListener("mousedown", (e) => {
      if (e.target === paperEl) {
        e.preventDefault();
        focusLine(lines.length - 1);
      }
    });

    // double-click a result line to copy just the number
    paperEl.addEventListener("dblclick", (e) => {
      const res = e.target && e.target.closest ? e.target.closest(".res") : null;
      if (!res || res.classList.contains("bad")) return;
      const row = res.closest(".line");
      const i = row ? Number(row.dataset.i) : -1;
      if (i < 0) return;
      void copyResult(res, i);
    });

    async function copyResult(res, i) {
      const v = evalExpr(lines[i] || "");
      if (v === null) return;
      const text = String(v);
      try {
        await uTools.copyText(text);
        flashCopied(res, i, text);
      } catch (e) {
        setStatus("复制失败: " + (e && e.message ? e.message : e));
      }
    }

    function flashCopied(res, i, text) {
      if (res._flash) window.clearTimeout(res._flash);
      res.classList.add("copied");
      res.textContent = "= " + text + "   ✓ 已复制";
      res._flash = window.setTimeout(() => {
        res.classList.remove("copied");
        updateResult(res.closest(".line"), i, true);
      }, 900);
    }

    // ---------------------------------------------------------- persistence
    // Flush immediately: the launcher window blur-hides as soon as focus
    // moves to another app, and the window is hidden in a few ms — a
    // debounced save that has not fired yet would be lost (input "gone").
    function scheduleSave() {
      if (saveTimer) {
        window.clearTimeout(saveTimer);
        saveTimer = null;
      }
      void save();
    }

    // The host fires these right before the detail view disappears
    // (Esc / window blur). The debounce-free scheduleSave above already
    // flushes on every keystroke, but a write may still be in flight —
    // make it deterministic instead of racing the hide.
    uTools.onDetailClose(() => save());

    async function save() {
      try {
        // A result-seeded row is an editing aid, not a completed history row.
        // Persist it only after the user actually continues or replaces it.
        const persisted = lines.filter((_, i) => !continuationRows.has(i));
        await uTools.writeFile(PAPER_FILE, persisted.join("\n"));
        setStatus("已暂存 " + new Date().toLocaleTimeString());
      } catch (e) {
        setStatus("暂存失败: " + (e && e.message ? e.message : e));
      }
    }

    document.getElementById("clear").onclick = () => {
      lines = [""];
      render(0);
      void save();
      uTools.toast("计算稿纸已清空 🧹");
    };

    // --------------------------------------------------------------- load
    window.addEventListener("DOMContentLoaded", async () => {
      let ctx = null;
      try { ctx = await uTools.getDetailContext(); } catch (_) { /* ignore */ }
      const item = ctx && ctx.item ? ctx.item : null;

      let migrated = false;
      try {
        const txt = await uTools.readFile(PAPER_FILE);
        lines = String(txt).split("\n");
      } catch (_) {
        // one-time migration from the older records.json format
        try {
          const raw = await uTools.readFile("records.json");
          const parsed = JSON.parse(raw);
          lines = Array.isArray(parsed)
            ? parsed.map((r) => String((r && r.expr) || "")).filter(Boolean)
            : [];
          migrated = lines.length > 0;
        } catch (_) {
          lines = [];
        }
      }
      if (lines.length === 0) lines = [""];

      // The expression that opened this view (inline calc / auto-open). All
      // trailing blank lines are dropped first so an empty paper never ends
      // up with a stray blank row above the incoming expression.
      const incoming =
        item && item.data && item.data.action === "calc"
          ? String(item.data.expr || "").trim()
          : "";
      let needsSave = migrated;
      while (lines.length && lines[lines.length - 1].trim() === "") lines.pop();
      if (incoming && String(lines[lines.length - 1] || "") !== incoming) {
        lines.push(incoming);
        needsSave = true;
      }
      while (lines.length && lines[lines.length - 1].trim() === "") lines.pop();
      lines.push(""); // the paper always keeps one blank line to type on

      render();
      focusLine(lines.length - 1);
      updateFooter();
      setStatus("已就绪");
      if (needsSave) void save(); // materialise paper.txt
    });
  </script>
</body>
</html>
