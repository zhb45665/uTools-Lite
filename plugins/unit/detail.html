<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>单位换算</title>
  <style>
    /* Theme follows the OS (Electron themeSource=system). */
    :root {
      --bg: #f7f7f9;
      --text: #1c1c1e;
      --dim: rgba(0, 0, 0, 0.45);
      --faint: rgba(0, 0, 0, 0.3);
      --divider: rgba(0, 0, 0, 0.08);
      --field-bg: #ffffff;
      --field-border: rgba(0, 0, 0, 0.15);
      --field-text: #111113;
      --tab-bg: rgba(0, 0, 0, 0.05);
      --tab-text: rgba(0, 0, 0, 0.6);
      --result-accent: #274ea6;
      --btn-soft: rgba(0, 0, 0, 0.06);
      --btn-soft-hover: rgba(0, 0, 0, 0.12);
      --btn-soft-text: #1c1c1e;
      --warn-bg: rgba(200, 110, 20, 0.12);
      --warn-border: rgba(200, 110, 20, 0.35);
      --warn-text: #9a5b00;
      --warn-bg-hover: rgba(200, 110, 20, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1e;
        --text: #e8e8ea;
        --dim: rgba(255, 255, 255, 0.4);
        --faint: rgba(255, 255, 255, 0.3);
        --divider: rgba(255, 255, 255, 0.08);
        --field-bg: #26262c;
        --field-border: rgba(255, 255, 255, 0.12);
        --field-text: #f2f2f4;
        --tab-bg: rgba(255, 255, 255, 0.06);
        --tab-text: rgba(255, 255, 255, 0.6);
        --result-accent: #7ea6ff;
        --btn-soft: rgba(255, 255, 255, 0.1);
        --btn-soft-hover: rgba(255, 255, 255, 0.18);
        --btn-soft-text: #e8e8ea;
        --warn-bg: rgba(255, 150, 60, 0.15);
        --warn-border: rgba(255, 150, 60, 0.35);
        --warn-text: #ffd9b0;
        --warn-bg-hover: rgba(255, 150, 60, 0.28);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px "Segoe UI", system-ui, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    h1 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
    h1 .sub { font-size: 12px; font-weight: 400; color: var(--dim); }
    .tabs { display: flex; gap: 6px; }
    .tab {
      background: var(--tab-bg);
      border: 1px solid transparent;
      color: var(--tab-text);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .tab.active {
      background: rgba(80,120,255,0.2);
      border-color: rgba(80,120,255,0.5);
      color: #fff;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    input, select {
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      color: var(--field-text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: rgba(80,120,255,0.6); }
    input.value { width: 130px; }
    select { width: 90px; }
    .arrow { color: var(--dim); }
    .result {
      font-size: 22px;
      font-weight: 700;
      color: var(--result-accent);
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .result button {
      font-size: 12px;
      background: var(--btn-soft);
      border: none;
      color: var(--btn-soft-text);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .result button:hover { background: var(--btn-soft-hover); }
    .panel {
      border-top: 1px solid var(--divider);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel .title { font-size: 12px; color: var(--dim); }
    .panel button {
      align-self: flex-start;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .panel button:hover { background: var(--warn-bg-hover); }
    .panel .out { font-size: 12px; color: var(--dim); min-height: 16px; }
    .foot { margin-top: auto; font-size: 11px; color: var(--faint); }
  </style>
</head>
<body>
  <h1>📐 单位换算 <span class="sub">计算由插件 main.js 完成（消息桥示例）</span></h1>

  <div class="tabs" id="tabs">
    <button class="tab active" data-kind="length">长度</button>
    <button class="tab" data-kind="weight">重量</button>
    <button class="tab" data-kind="temp">温度</button>
  </div>

  <div class="row">
    <input class="value" id="value" type="number" value="1" />
    <select id="from"></select>
    <span class="arrow">→</span>
    <select id="to"></select>
  </div>

  <div class="result">
    <span id="out">—</span>
    <button id="copy" style="display:none">复制结果</button>
  </div>

  <div class="panel">
    <div class="title">网络请求示例（声明 net 权限，由宿主代理发起）</div>
    <button id="web">让 main.js 通过宿主 fetch 一个网页</button>
    <div class="out" id="webout"></div>
  </div>

  <div class="foot">Esc 关闭 · 插件声明了 net + clipboard 权限</div>

  <script>
    const UNITS = {
      length: ["mm", "cm", "m", "km", "in", "ft", "mi"],
      weight: ["mg", "g", "kg", "t", "oz", "lb"],
      temp: ["c", "f", "k"],
    };
    let kind = "length";
    let reqId = 1;
    const pending = new Map();

    const fromSel = document.getElementById("from");
    const toSel = document.getElementById("to");
    const valueIn = document.getElementById("value");
    const outEl = document.getElementById("out");
    const copyBtn = document.getElementById("copy");
    let lastResultText = "";

    function fillSelects() {
      const list = UNITS[kind];
      fromSel.innerHTML = "";
      toSel.innerHTML = "";
      list.forEach((u) => {
        fromSel.add(new Option(u, u));
        toSel.add(new Option(u, u));
      });
      fromSel.value = list[0];
      toSel.value = list[1] || list[0];
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const t = e.target.closest(".tab");
      if (!t) return;
      kind = t.dataset.kind;
      document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
      fillSelects();
      compute();
    });

    function compute() {
      const value = valueIn.value;
      const from = fromSel.value;
      const to = toSel.value;
      // 通过宿主消息桥请 main.js 计算（插件自身没有计算入口以外的逻辑）
      uTools.sendMainMessage({ type: "convert", reqId: reqId, value, from, to, kind });
    }

    ["input", "change"].forEach((ev) => {
      valueIn.addEventListener(ev, compute);
      fromSel.addEventListener(ev, compute);
      toSel.addEventListener(ev, compute);
    });

    uTools.onMainMessage((msg) => {
      if (!msg || typeof msg !== "object") return;
      if (msg.type === "result" && pending.has(msg.reqId)) {
        const req = pending.get(msg.reqId);
        pending.delete(msg.reqId);
        if (msg.result === null) {
          outEl.textContent = "无法换算（单位不匹配）";
          lastResultText = "";
        } else {
          outEl.textContent = `${msg.result} ${req.to}`;
          lastResultText = `${req.value} ${req.from} = ${msg.result} ${req.to}`;
        }
        copyBtn.style.display = lastResultText ? "" : "none";
      } else if (msg.type === "web-result") {
        const el = document.getElementById("webout");
        el.textContent = msg.ok
          ? `✅ 宿主代 fetch 成功：HTTP ${msg.status}，收到 ${msg.bytes} 字节`
          : `⚠️ 请求失败（离线或未授予？）：${msg.error}`;
      }
    });

    // 上面 compute() 发送后，用 onMainMessage 匹配 reqId；这里登记请求。
    const _origCompute = compute;
    compute = function () {
      const value = valueIn.value;
      const from = fromSel.value;
      const to = toSel.value;
      const id = reqId++;
      pending.set(id, { value, from, to });
      uTools.sendMainMessage({ type: "convert", reqId: id, value, from, to, kind });
    };

    document.getElementById("copy").onclick = () => {
      if (lastResultText) uTools.sendMainMessage({ type: "copy-result", text: lastResultText });
    };

    document.getElementById("web").onclick = () => {
      const id = reqId++;
      document.getElementById("webout").textContent = "请求中…";
      uTools.sendMainMessage({ type: "web-lookup", reqId: id });
    };

    window.addEventListener("DOMContentLoaded", () => {
      fillSelects();
      compute();
      uTools.getDetailContext().then((ctx) => {
        // 如果从 "unit 5km->mi" 内联结果进入，直接填好表单
        if (ctx && ctx.item && ctx.item.data) {
          const d = ctx.item.data;
          if (d.value && d.from && d.to) {
            valueIn.value = d.value;
            fromSel.value = d.from;
            toSel.value = d.to;
            compute();
          }
        }
      });
    });
  </script>
</body>
</html>
