<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密码本 · 服务器与账号</title><link rel="stylesheet" href="detail.css"></head>
<body>
<header class="toolbar"><div class="brand"><span class="brand-mark">▤</span><div><strong>凭据空间</strong><small>服务器与普通账号</small></div></div><nav><button id="tab-vault" class="active">密码本</button><button id="tab-gen">生成器</button></nav><span class="spacer"></span><button id="backup" hidden>加密备份</button><button id="restore-open">恢复备份</button><button id="lockbtn" hidden>锁定</button></header>
<div id="status" role="status" class="status">正在读取密码本…</div>
<section id="lockbox" class="lockbox"><div class="lock-emblem">⌑</div><h1 id="locktitle">解锁你的凭据</h1><p id="lockhint">使用主密码访问本机加密保存的服务器和账号。</p><form id="unlock-form"><label for="master">主密码</label><input id="master" type="password" autocomplete="off" required><div id="confirm-master" hidden><label for="master2">再次确认主密码</label><input id="master2" type="password" autocomplete="off"></div><p id="lockerr" class="error" role="alert"></p><button class="primary" id="unlockbtn" type="submit" disabled>解锁</button></form><small>主密码忘记后无法找回，请妥善保管加密备份。</small></section>
<section id="workspace" class="workspace" hidden>
<aside class="sidebar"><div class="sidebar-head"><input id="filter" aria-label="搜索凭据" placeholder="名称、IP、账号或分组" autocomplete="off"><button id="newbtn" class="primary">＋ 新建</button></div>
<div class="filters"><select id="type-filter" aria-label="凭据类型"><option value="">全部类型</option value="server">服务器</option><option value="account">普通账号</option></select><select id="env-filter" aria-label="环境筛选"><option value="">全部环境</option><option value="production">生产</option><option value="testing">测试</option><option value="development">开发</option></select><select id="group-filter" aria-label="分组筛选"><option value="">全部分组</option></select><label class="favorite-filter"><input type="checkbox" id="favorites">仅收藏</label></div>
<div class="list-meta" id="count"></div><div id="list" class="list" aria-label="凭据列表"></div></aside>
<main class="content"><div id="detail" class="detail"><div class="empty">选择一条凭据查看详情，或新建服务器记录。</div></div>
<form id="editor" class="editor" hidden autocomplete="off"><div class="section-head"><h2 id="editor-title">新建凭据</h2><span>密码不会自动生成</span></div><div class="form-grid">
<div class="field"><label for="f-type">记录类型</label><select id="f-type"><option value="server">服务器</option><option value="account">普通账号</option></select></div>
<div class="field"><label for="f-title">名称 *</label><input id="f-title" required placeholder="例如 商城后台主机"></div>
<div class="field"><label for="f-group">项目 / 分组</label><input id="f-group" list="group-options" placeholder="例如 商城项目"><datalist id="group-options"></datalist></div>
<div class="field"><label for="f-env">环境</label><select id="f-env"><option value="">未指定</option><option value="production">生产</option><option value="testing">测试</option><option value="development">开发</option></select></div>
<div class="field server-field"><label for="f-protocol">连接方式</label><select id="f-protocol"><option value="ssh">SSH</option><option value="rdp">远程桌面</option><option value="other">其他</option></select></div>
<div class="field server-field"><label for="f-auth">认证方式</label><select id="f-auth"><option value="password">密码</option><option value="key">SSH 密钥</option></select></div>
<div class="field server-field"><label for="f-host">主机 IP / 域名 *</label><input id="f-host" class="mono" placeholder="192.0.2.10 / example.com"></div>
<div class="field server-field"><label for="f-port">端口 *</label><input id="f-port" type="number" min="1" max="65535" placeholder="22"></div>
<div class="field"><label for="f-user">用户名 / 账号</label><input id="f-user" class="mono" placeholder="root / ubuntu / 邮箱"></div>
<div class="field account-field"><label for="f-url">网址</label><input id="f-url" placeholder="https://example.com"></div>
<div class="field full key-field" hidden><label for="f-key">本机密钥文件路径 *</label><input id="f-key" class="mono" placeholder="C:\Users\me\.ssh\id_ed25519"><small>只记录文件路径，不读取或上传私钥。</small></div>
<div class="field full"><label for="f-pass" id="pass-label">密码</label><div class="password-input"><input id="f-pass" type="password" class="mono" autocomplete="new-password" placeholder="粘贴已有密码；需要时再生成"><button id="f-reveal" type="button">显示</button><button id="f-gen" type="button">生成</button></div></div>
<div class="field full"><label for="f-note">备注 / 连接说明</label><textarea id="f-note" rows="4" placeholder="跳板机、部署目录、用途和连接步骤…"></textarea></div>
</div><p id="f-err" class="error" role="alert"></p><div class="edit-actions"><button id="f-save" class="primary" type="submit">保存凭据</button><button id="f-cancel" type="button">取消</button></div></form></main>
</section>
<section id="generator" class="generator" hidden><div class="section-head"><h2>随机密码生成器</h2><span>按需生成，复制后 30 秒清理</span></div><output id="genpw" class="genpw"></output><div class="gen-controls"><label for="len">密码长度 <strong id="lenval">20</strong></label><input id="len" type="range" min="8" max="64" value="20"><div class="checks"><label><input id="opt-upper" type="checkbox" checked>大写</label><label><input id="opt-lower" type="checkbox" checked>小写</label><label><input id="opt-digits" type="checkbox" checked>数字</label><label><input id="opt-symbols" type="checkbox" checked>符号</label><label><input id="opt-amb" type="checkbox" checked>排除易混字符</label></div><p id="strength"></p><button id="regen">重新生成</button><button id="gencopy" class="primary">复制密码</button></div></section>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button id="confirm-no">取消</button><button id="confirm-yes" class="danger">确认</button></div></dialog>
<dialog id="restore-dialog"><h2>恢复加密备份</h2><p>恢复会替换当前记录。现有文件会先保存为本机加密副本；恢复后使用备份的主密码解锁。</p><form id="restore-form"><label for="restore-file">加密备份文件</label><button id="restore-file" type="button">选择加密备份文件…</button><p id="restore-name">尚未选择</p><label for="restore-master">备份的主密码</label><input id="restore-master" type="password" autocomplete="off" required><label class="restore-check"><input id="restore-confirm" type="checkbox" required>我确认用备份替换当前记录</label><p id="restore-error" class="error" role="alert"></p><div class="dialog-actions"><button id="restore-cancel" type="button">取消</button><button id="restore-submit" type="submit" class="primary">恢复备份</button></div></form></dialog>
<footer><span>密码默认隐藏 · 敏感复制 30 秒后清理</span><span>闲置 5 分钟锁定</span></footer>
<script src="pwdgen.js"></script><script src="records.js"></script><script src="detail.js"></script>
</body></html>
