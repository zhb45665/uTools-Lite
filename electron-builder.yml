appId: com.example.utools-lite
productName: uTools Lite
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - plugin-host/**
  - plugins/**
  # Tray icon is loaded at runtime from inside the asar (src/main/index.ts);
  # without this entry the packaged app finds an empty image and the
  # Windows Tray constructor throws, crashing startup.
  - build/tray-icon.png
  - package.json
asarUnpack:
  - plugin-host/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/**
  - node_modules/bmp-js/**
  - node_modules/is-url/**
  - node_modules/node-fetch/**
  - node_modules/regenerator-runtime/**
  - node_modules/wasm-feature-detect/**
  - node_modules/zlibjs/**
  - node_modules/sql.js/**
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
